<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Business Card Scanner</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        .navbar {
            background-color: #001f3f; color: white; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center; margin: -20px -20px 20px -20px;
        }
        .nav-brand { font-size: 16px; font-weight: bold; color: white; }
        .nav-brand span { color: #D4AF37; }
        .nav-links a {
            color: white; text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 6px 12px; background: rgba(255,255,255,0.15); border-radius: 4px;
        }
        .nav-links a:hover { background: #D4AF37; color: #001f3f; }

        body { font-family: Arial, sans-serif; padding: 20px; max-width: 550px; margin: auto; background-color: #f9f9f9; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="email"], textarea { 
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; background: #fff;
        }
        #output-box { margin-top: 20px; padding: 15px; background: #fff; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .loading { color: blue; font-style: italic; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        .alert-note { background-color: #e2f0d9; color: #385723; padding: 10px; border-radius: 5px; border: 1px solid #c8e1b7; font-size: 13px; margin-bottom: 15px; }
        
        #camera-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; display: none; margin-bottom: 10px; }
        #video-stream { width: 100%; height: auto; display: block; }
        
        .viewfinder-overlay {
            position: absolute; top: 25%; left: 10%; width: 80%; height: 50%;
            border: 3px dashed #ff4d4d; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
            pointer-events: none; box-sizing: border-box; border-radius: 8px;
            transition: border-color 0.3s ease;
        }
        .viewfinder-overlay.ready {
            border: 3px solid #00ffcc !important;
            box-shadow: 0 0 15px #00ffcc, 0 0 0 1000px rgba(0, 0, 0, 0.5);
        }
        .viewfinder-text { 
            position: absolute; top: 5px; width: 100%; text-align: center; color: #fff; 
            font-size: 13px; font-weight: bold; background: rgba(0, 0, 0, 0.7); padding: 6px 0; 
        }
        
        .brightness-box { display: none; align-items: center; gap: 10px; background: #222; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; color: white; font-size: 13px; }
        .brightness-box input { flex: 1; }

        .camera-controls { display: none; gap: 10px; margin-bottom: 15px; }
        .upload-btn {
            display: block; width: 100%; padding: 14px; color: white; border-radius: 5px;
            font-weight: bold; font-size: 15px; text-align: center; cursor: pointer; margin-top: 10px; box-sizing: border-box; border: none;
        }
        .btn-camera { background-color: #008CBA; }
        .btn-capture { background-color: #ff9800; margin: 0; flex: 2; }
        .btn-flash { background-color: #333; margin: 0; flex: 1; }
        .btn-flash.active { background-color: #f39c12; color: #fff; }
        .btn-gallery { background-color: #6c757d; }
        .btn-save { background-color: #4CAF50; color: white; padding: 15px; width: 100%; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; display: none; cursor: pointer; margin-top: 20px;}
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">Alumni<span>Scanner</span></div>
        <div class="nav-links">
            <a href="dashboard.html">⚙️ Admin Portal</a>
        </div>
    </div>

    <h2>Alumni Business Card Scanner</h2>
    <p style="font-size: 14px; color: #555;">Scan business cards and review details quickly.</p>
    
    <button type="button" class="upload-btn btn-camera" id="btn-start-cam">📸 Open Live Camera Viewfinder</button>
    
    <div id="camera-container">
        <video id="video-stream" autoplay playsinline muted></video>
        <div class="viewfinder-overlay" id="viewfinder-frame">
            <div class="viewfinder-text" id="viewfinder-msg">⚠️ Center business card inside box</div>
        </div>
    </div>

    <div class="brightness-box" id="brightness-box">
        <span>☀️ Brightness:</span>
        <input type="range" id="brightness-range" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>
    
    <div class="camera-controls" id="camera-controls">
        <button type="button" class="upload-btn btn-flash" id="btn-flash">🔦 Flash: OFF</button>
        <button type="button" class="upload-btn btn-capture" id="btn-capture-cam">🔘 Capture Card Photo</button>
    </div>

    <label for="gallery-input" class="upload-btn btn-gallery">
        🖼️ Choose from Gallery
    </label>
    <input type="file" id="gallery-input" accept="image/*" style="display: none;">

    <canvas id="canvas" style="display:none;"></canvas>
    
    <div id="status" style="margin-top: 15px;"></div>
    
    <div id="output-box">
        <div class="alert-note">
            <b>Smart Viewfinder Active:</b> Align card until the frame turns glowing green for optimal scanning results.
        </div>

        <div class="form-group">
            <label>Title (e.g., Dr. / Mr. / Ts. / Ir.):</label>
            <input type="text" id="in-title" placeholder="E.g., Dr. / Mr. / Ir.">
        </div>

        <div class="form-group">
            <label>First Name:</label>
            <input type="text" id="in-firstname" placeholder="First Name">
        </div>

        <div class="form-group">
            <label>Last Name:</label>
            <input type="text" id="in-lastname" placeholder="Last Name">
        </div>

        <div class="form-group">
            <label>Job Title:</label>
            <input type="text" id="in-job" placeholder="Job Title">
        </div>

        <div class="form-group">
            <label>Company / University Name:</label>
            <input type="text" id="in-company" placeholder="Company Name">
        </div>
        
        <div class="form-group">
            <label>Country or Territory:</label>
            <input type="text" id="in-country" value="Malaysia">
        </div>

        <div class="form-group">
            <label>Company Email:</label>
            <input type="email" id="in-email" placeholder="email@company.com">
        </div>

        <div class="form-group">
            <label>Phone Number (Optional):</label>
            <input type="text" id="in-phone" placeholder="+60...">
        </div>
        
        <p style="font-size:12px; color:gray; font-weight:bold;">Raw OCR Text Output:</p>
        <textarea id="out-raw" rows="4"></textarea>

        <button id="btn-simpan" class="btn-save">💾 Save to Database</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB2bVsX_rioyocFHUzZ4A-WQ5t7yPFuw_w",
            authDomain: "alumni-scanner-9e82c.firebaseapp.com",
            databaseURL: "https://alumni-scanner-9e82c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "alumni-scanner-9e82c",
            storageBucket: "alumni-scanner-9e82c.firebasestorage.app",
            messagingSenderId: "811368515827",
            appId: "1:811368515827:web:a89c43de11fc995ec5cf86"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const statusDiv = document.getElementById('status');
        const btnSimpan = document.getElementById('btn-simpan');
        
        const videoStream = document.getElementById('video-stream');
        const cameraContainer = document.getElementById('camera-container');
        const cameraControls = document.getElementById('camera-controls');
        const brightnessBox = document.getElementById('brightness-box');
        const brightnessRange = document.getElementById('brightness-range');
        const btnStartCam = document.getElementById('btn-start-cam');
        const btnCaptureCam = document.getElementById('btn-capture-cam');
        const btnFlash = document.getElementById('btn-flash');
        const viewfinderFrame = document.getElementById('viewfinder-frame');
        const viewfinderMsg = document.getElementById('viewfinder-msg');
        
        let mediaStream = null;
        let track = null;
        let flashOn = false;
        let analysisInterval = null;

        btnStartCam.addEventListener('click', async function() {
            statusDiv.innerHTML = "<p class='loading'>⏳ Opening camera... Please allow permission.</p>";
            
            // Semak sama ada pelayar menyokong mediaDevices
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("❌ Pelayar anda tidak menyokong akses kamera terus.");
                statusDiv.innerHTML = "<p style='color: red;'>❌ Browser not supported getUserMedia.</p>";
                return;
            }

            try {
                // Minta akses kamera belakang (environment)
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: "environment" } 
                    },
                    audio: false
                });
                
                videoStream.srcObject = mediaStream;
                
                // Paksa video dimainkan dengan selamat
                videoStream.onloadedmetadata = async () => {
                    try {
                        await videoStream.play();
                        cameraContainer.style.display = 'block';
                        brightnessBox.style.display = 'flex';
                        cameraControls.style.display = 'flex';
                        btnStartCam.style.display = 'none';
                        statusDiv.innerHTML = "<p class='success'>📷 Live camera active!</p>";
                        startViewfinderAnalyzer();
                    } catch (playErr) {
                        console.error("Video play failed:", playErr);
                        alert("❌ Gagal memainkan video kamera: " + playErr.message);
                    }
                };

                const videoTracks = mediaStream.getVideoTracks();
                if (videoTracks.length > 0) {
                    track = videoTracks[0];
                }

            } catch (err) {
                console.error("Camera access error:", err);
                statusDiv.innerHTML = `<p style='color: red;'>❌ Camera Error: ${err.message}</p>`;
                alert("❌ Tidak dapat membuka kamera: " + err.message + "\n\nSila pastikan anda melayari laman web ini melalui protokol HTTPS (bukan HTTP biasa) dan telah memberi kebenaran (permission) kamera pada pelayar.");
            }
        });

        function startViewfinderAnalyzer() {
            const analysisCanvas = document.createElement('canvas');
            const analysisCtx = analysisCanvas.getContext('2d');

            analysisInterval = setInterval(() => {
                if (videoStream.readyState !== videoStream.HAVE_ENOUGH_DATA) return;

                analysisCanvas.width = 150;
                analysisCanvas.height = 100;
                analysisCtx.drawImage(videoStream, 0, 0, 150, 100);

                const imgData = analysisCtx.getImageData(0, 0, 150, 100).data;
                let totalBrightness = 0;
                let edgeVariation = 0;

                for (let i = 0; i < imgData.length; i += 16) {
                    let r = imgData[i];
                    let g = imgData[i+1];
                    let b = imgData[i+2];
                    let brightness = (r + g + b) / 3;
                    totalBrightness += brightness;

                    if (i > 16) {
                        let prevBrightness = (imgData[i-16] + imgData[i-15] + imgData[i-14]) / 3;
                        edgeVariation += Math.abs(brightness - prevBrightness);
                    }
                }

                let avgBrightness = totalBrightness / (imgData.length / 16);
                let avgEdge = edgeVariation / (imgData.length / 16);

                if (avgBrightness > 40 && avgBrightness < 230 && avgEdge > 3.5) {
                    viewfinderFrame.classList.add('ready');
                    viewfinderMsg.innerText = "✨ Perfect! Ready to Capture";
                    viewfinderMsg.style.color = "#00ffcc";
                } else if (avgBrightness <= 40) {
                    viewfinderFrame.classList.remove('ready');
                    viewfinderMsg.innerText = "💡 Too dark! Turn on Flash or Brightness";
                    viewfinderMsg.style.color = "#ff4d4d";
                } else {
                    viewfinderFrame.classList.remove('ready');
                    viewfinderMsg.innerText = "↔️ Adjust position & steady card";
                    viewfinderMsg.style.color = "#ffeb3b";
                }
            }, 500);
        }

        brightnessRange.addEventListener('input', function() {
            videoStream.style.filter = `brightness(${brightnessRange.value}) contrast(1.2)`;
        });

        btnFlash.addEventListener('click', async function() {
            if (!track) return;
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            
            if (capabilities && capabilities.torch) {
                flashOn = !flashOn;
                try {
                    await track.applyConstraints({ advanced: [{ torch: flashOn }] });
                    if (flashOn) {
                        btnFlash.innerText = "🔦 Flash: ON";
                        btnFlash.classList.add('active');
                    } else {
                        btnFlash.innerText = "🔦 Flash: OFF";
                        btnFlash.classList.remove('active');
                    }
                } catch (err) {
                    alert("❌ Failed to toggle flashlight: " + err);
                }
            } else {
                alert("⚠️ Flashlight is not supported on this device/browser.");
            }
        });

        btnCaptureCam.addEventListener('click', function() {
            if (analysisInterval) clearInterval(analysisInterval);

            const canvas = document.getElementById('canvas');
            canvas.width = videoStream.videoWidth || 1280;
            canvas.height = videoStream.videoHeight || 720;
            
            const ctx = canvas.getContext('2d');
            ctx.filter = `brightness(${brightnessRange.value}) contrast(1.5)`;
            ctx.drawImage(videoStream, 0, 0, canvas.width, canvas.height);

            if (track && flashOn) {
                track.applyConstraints({ advanced: [{ torch: false }] }).catch(e => {});
                flashOn = false;
                btnFlash.innerText = "🔦 Flash: OFF";
                btnFlash.classList.remove('active');
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
            cameraContainer.style.display = 'none';
            brightnessBox.style.display = 'none';
            cameraControls.style.display = 'none';
            btnStartCam.style.display = 'block';

            processAndRunOCR(canvas);
        });

        document.getElementById('gallery-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerHTML = "<p class='loading'>⏳ Processing uploaded image...</p>";
            btnSimpan.style.display = "none";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    processAndRunOCR(canvas);
                };
            };
        });

        function processAndRunOCR(canvas) {
            const ctx = canvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const contrastFactor = 1.8;
            const intercept = 128 * (1 - contrastFactor);

            for (let i = 0; i < data.length; i += 4) {
                let avg = (data[i] * 0.299) + (data[i+1] * 0.587) + (data[i+2] * 0.114);
                let contrasted = avg * contrastFactor + intercept;
                let finalVal = contrasted < 0 ? 0 : (contrasted > 255 ? 255 : contrasted);

                data[i]     = finalVal;
                data[i+1]   = finalVal;
                data[i+2]   = finalVal;
            }

            ctx.putImageData(imgData, 0, 0);
            runTesseractOCR(canvas.toDataURL('image/jpeg', 0.95));
        }

        async function runTesseractOCR(imageSource) {
            statusDiv.innerHTML = "<p class='loading'>⏳ Reading text and parsing fields...</p>";
            btnSimpan.style.display = "none";

            document.getElementById('in-title').value = "";
            document.getElementById('in-firstname').value = "";
            document.getElementById('in-lastname').value = "";
            document.getElementById('in-job').value = "";
            document.getElementById('in-company').value = "";
            document.getElementById('in-email').value = "";
            document.getElementById('in-phone').value = "";
            document.getElementById('out-raw').value = "";

            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(imageSource);
                const text = ret.data.text;
                await worker.terminate();

                statusDiv.innerHTML = "<p class='success'>✅ Scan Complete! Review details below.</p>";
                document.getElementById('out-raw').value = text;

                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 2);

                let detectedTitle = "";
                let detectedName = "";
                let detectedJob = "";
                let detectedCompany = "";
                let detectedEmail = "";
                let detectedPhone = "";

                const titlesList = ["Dr.", "Prof.", "Ts.", "Ir.", "En.", "Cik", "Pn.", "Mr.", "Ms."];
                const jobKeywords = ["DIRECTOR", "MANAGER", "ENGINEER", "EXECUTIVE", "OFFICER", "SPECIALIST", "CONSULTANT", "DEVELOPER", "LECTURER", "SERVICE DELIVERY", "LIAISON", "SENIOR", "FOUNDER"];

                for (let line of lines) {
                    if (!detectedEmail && line.includes('@')) {
                        let matchEmail = line.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/);
                        if (matchEmail) detectedEmail = matchEmail[0];
                    }
                    if (!detectedPhone && (/(\+?60|01|0[3-9])[0-9\-\s]{7,12}/).test(line)) {
                        let matchPhone = line.match(/(\+?60|01|0[3-9])[0-9\-\s]{7,12}/);
                        if (matchPhone) detectedPhone = matchPhone[0].trim();
                    }
                }

                for (let line of lines) {
                    let upper = line.toUpperCase();
                    if (!detectedCompany && (upper.includes("SDN") || upper.includes("BHD") || upper.includes("ENTERPRISE") || upper.includes("CONSULT"))) {
                        let cleanLine = line;
                        let sdnBhdIdx = upper.indexOf("SDN");
                        let bhdIdx = upper.indexOf("BHD");
                        let entIdx = upper.indexOf("ENTERPRISE");

                        if (sdnBhdIdx !== -1) {
                            let cutPoint = sdnBhdIdx + (upper.includes("SDN.") ? 8 : 7);
                            cleanLine = line.substring(0, cutPoint);
                        } else if (bhdIdx !== -1) {
                            cleanLine = line.substring(0, bhdIdx + 3);
                        } else if (entIdx !== -1) {
                            cleanLine = line.substring(0, entIdx + 10);
                        }

                        detectedCompany = cleanLine.replace(/[^a-zA-Z0-9\s\.\,\(\)]+$/, "").trim();
                        break;
                    }
                }

                for (let line of lines) {
                    let upper = line.toUpperCase();
                    if (!detectedJob && line !== detectedCompany && jobKeywords.some(kw => upper.includes(kw))) {
                        detectedJob = line;
                        break;
                    }
                }

                for (let line of lines) {
                    let upper = line.toUpperCase();
                    if (line === detectedCompany || line === detectedJob || line.includes('@') || upper.includes("JALAN") || upper.includes("SUITE") || upper.includes("LEVEL") || upper.includes("REGISTRATION") || upper.includes("KUALA LUMPUR") || upper.includes("SELANGOR") || upper.includes("WWW.") || (/^[0-9\-\+\s]+$/).test(line)) {
                        continue;
                    }

                    for (let t of titlesList) {
                        if (line.startsWith(t)) {
                            detectedTitle = t;
                            line = line.replace(t, "").trim();
                            break;
                        }
                    }

                    if (!detectedName && (upper.includes(" BIN ") || upper.includes(" BINTI ") || upper.includes(" A/L ") || upper.includes(" A/P ") || (!jobKeywords.some(kw => upper.includes(kw)) && !upper.includes("SDN") && !upper.includes("BHD") && line.length > 3 && line.length < 30))) {
                        detectedName = line;
                        break;
                    }
                }

                document.getElementById('in-title').value = detectedTitle;
                
                if (detectedName) {
                    let parts = detectedName.split(' ');
                    document.getElementById('in-firstname').value = parts[0] || "";
                    document.getElementById('in-lastname').value = parts.slice(1).join(' ') || "";
                }

                document.getElementById('in-job').value = detectedJob || "";
                document.getElementById('in-company').value = detectedCompany || "";
                document.getElementById('in-email').value = detectedEmail ? detectedEmail.toLowerCase() : "";
                document.getElementById('in-phone').value = detectedPhone || "";

                btnSimpan.style.display = "block";

            } catch (err) {
                statusDiv.innerHTML = "<p style='color: red;'>❌ OCR Error: " + err.message + "</p>";
            }
        }

        btnSimpan.addEventListener('click', function() {
            const finalData = {
                title: document.getElementById('in-title').value.trim(),
                first_name: document.getElementById('in-firstname').value.trim(),
                last_name: document.getElementById('in-lastname').value.trim(),
                job_title: document.getElementById('in-job').value.trim(),
                company: document.getElementById('in-company').value.trim(),
                country: document.getElementById('in-country').value.trim(),
                email: document.getElementById('in-email').value.trim().toLowerCase(),
                phone: document.getElementById('in-phone').value.trim(), 
                time_scanned: new Date().toLocaleString()
            };

            if (!finalData.title || !finalData.first_name || !finalData.last_name || !finalData.job_title || !finalData.company || !finalData.country || !finalData.email) {
                alert("⚠️ Please fill in all required fields!");
                return;
            }

            btnSimpan.innerText = "⏳ Saving to Database...";
            database.ref('AlumniCards').push(finalData)
            .then(() => {
                alert("✅ Successfully saved to Firebase!");
                location.reload();
            })
            .catch((error) => {
                alert("❌ Failed to save: " + error);
                btnSimpan.innerText = "💾 Save to Database";
            });
        });
    </script>
</body>
</html>
