<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Business Card Scanner</title>
    
    <!-- Tesseract OCR Library -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 550px; margin: auto; background-color: #f9f9f9; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="email"], textarea { 
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; background: #fff;
        }
        #output-box { margin-top: 20px; padding: 15px; background: #fff; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .loading { color: blue; font-style: italic; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        .alert-note { background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; border: 1px solid #ffeeba; font-size: 13px; margin-bottom: 15px; }
        
        /* Viewfinder Live Camera Styles */
        #camera-container {
            position: relative;
            width: 100%;
            max-height: 350px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            margin-bottom: 15px;
        }
        #video-stream {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Card Overlay Guide Frame */
        .viewfinder-overlay {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 80%;
            height: 70%;
            border: 2px dashed #00ffcc;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            box-sizing: border-box;
            border-radius: 6px;
        }
        .viewfinder-text {
            position: absolute;
            top: 5px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 0;
        }

        .upload-btn {
            display: block;
            width: 100%;
            padding: 14px;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            cursor: pointer;
            margin-top: 10px;
            box-sizing: border-box;
            border: none;
        }
        .btn-camera { background-color: #008CBA; }
        .btn-capture { background-color: #ff9800; margin-top: 5px; display: none; }
        .btn-gallery { background-color: #6c757d; }
        .btn-save { background-color: #4CAF50; color: white; padding: 15px; width: 100%; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; display: none; cursor: pointer; margin-top: 20px;}
    </style>
</head>
<body>

    <h2>Alumni Business Card Scanner</h2>
    <p style="font-size: 14px; color: #555;">Scan business cards and review details quickly.</p>
    
    <!-- Live Camera Viewfinder Container -->
    <button type="button" class="upload-btn btn-camera" id="btn-start-cam">📸 Open Live Camera Viewfinder</button>
    
    <div id="camera-container">
        <video id="video-stream" autoplay playsinline></video>
        <div class="viewfinder-overlay">
            <div class="viewfinder-text">Align business card inside the frame</div>
        </div>
    </div>
    <button type="button" class="upload-btn btn-capture" id="btn-capture-cam">🔘 Capture Card Photo</button>

    <!-- Choose from Gallery Button -->
    <label for="gallery-input" class="upload-btn btn-gallery">
        🖼️ Choose from Gallery
    </label>
    <input type="file" id="gallery-input" accept="image/*" style="display: none;">

    <canvas id="canvas" style="display:none;"></canvas>
    
    <div id="status" style="margin-top: 15px;"></div>
    
    <div id="output-box">
        
        <div class="alert-note">
            <b>Admin Note:</b> Please fill in all fields below. Phone number is optional, but other fields are required before saving.
        </div>

        <div class="form-group">
            <label>Title (e.g., Dr. / Mr. / Ts.):</label>
            <input type="text" id="in-title" placeholder="E.g., Dr.">
        </div>

        <div class="form-group">
            <label>First Name:</label>
            <input type="text" id="in-firstname" placeholder="E.g., Aminah">
        </div>

        <div class="form-group">
            <label>Last Name (Surname / Father's Name):</label>
            <input type="text" id="in-lastname" placeholder="E.g., Ahmad">
        </div>

        <div class="form-group">
            <label>Job Title:</label>
            <input type="text" id="in-job" placeholder="E.g., Senior Software Engineer">
        </div>

        <div class="form-group">
            <label>Company / University Name:</label>
            <input type="text" id="in-company" placeholder="E.g., Technova Solutions">
        </div>
        
        <div class="form-group">
            <label>Country or Territory:</label>
            <input type="text" id="in-country" placeholder="E.g., Malaysia" value="Malaysia">
        </div>

        <div class="form-group">
            <label>Company Email:</label>
            <input type="email" id="in-email" placeholder="E.g., aminah@technova.com">
        </div>

        <div class="form-group">
            <label>Phone Number (Optional):</label>
            <input type="text" id="in-phone" placeholder="E.g., +6014-325240">
        </div>
        
        <p style="font-size:12px; color:gray;">Raw OCR Text Output:</p>
        <textarea id="out-raw" rows="3" disabled></textarea>

        <button id="btn-simpan" class="btn-save">💾 Save to Database</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB2bVsX_rioyocFHUzZ4A-WQ5t7yPFuw_w",
            authDomain: "alumni-scanner-9e82c.firebaseapp.com",
            databaseURL: "https://alumni-scanner-9e82c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "alumni-scanner-9e82c",
            storageBucket: "alumni-scanner-9e82c.firebasestorage.app",
            messagingSenderId: "811368515827",
            appId: "1:811368515827:web:a89c43de11fc995ec5cf86"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const statusDiv = document.getElementById('status');
        const btnSimpan = document.getElementById('btn-simpan');
        
        const videoStream = document.getElementById('video-stream');
        const cameraContainer = document.getElementById('camera-container');
        const btnStartCam = document.getElementById('btn-start-cam');
        const btnCaptureCam = document.getElementById('btn-capture-cam');
        
        let mediaStream = null;

        // Start Live Camera Viewfinder
        btnStartCam.addEventListener('click', async function() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                videoStream.srcObject = mediaStream;
                cameraContainer.style.display = 'block';
                btnCaptureCam.style.display = 'block';
                btnStartCam.style.display = 'none';
                statusDiv.innerHTML = "<p class='loading'>📷 Live camera active. Position the card inside the frame.</p>";
            } catch (err) {
                alert("❌ Camera access denied or not supported: " + err);
            }
        });

        // Capture Photo from Live Viewfinder Stream
        btnCaptureCam.addEventListener('click', function() {
            const canvas = document.getElementById('canvas');
            canvas.width = videoStream.videoWidth;
            canvas.height = videoStream.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoStream, 0, 0, canvas.width, canvas.height);

            // Stop camera stream after capture
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            cameraContainer.style.display = 'none';
            btnCaptureCam.style.display = 'none';
            btnStartCam.style.display = 'block';

            const capturedImageURL = canvas.toDataURL('image/jpeg', 0.9);
            runTesseractOCR(capturedImageURL);
        });

        // Gallery Upload Handler
        document.getElementById('gallery-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerHTML = "<p class='loading'>⏳ Preparing gallery image...</p>";
            btnSimpan.style.display = "none";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let maxWidth = 1000;
                    let scale = maxWidth / img.width;
                    if (scale > 1) scale = 1;

                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const resizedImageURL = canvas.toDataURL('image/jpeg', 0.9);
                    runTesseractOCR(resizedImageURL);
                };
            };
        });

        async function runTesseractOCR(imageSource) {
            statusDiv.innerHTML = "<p class='loading'>⏳ Initializing OCR engine & reading text...</p>";
            btnSimpan.style.display = "none";

            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(imageSource);
                const text = ret.data.text;
                await worker.terminate();

                statusDiv.innerHTML = "<p class='success'>✅ Scan Complete! Review details below.</p>";
                document.getElementById('out-raw').value = text;

                // Extract Email
                const emailMatch = text.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/);
                document.getElementById('in-email').value = emailMatch ? emailMatch[0] : "";

                // Extract Phone Number (Optional)
                const phoneMatch = text.match(/(\+?60|01)[0-9-\s]{8,10}/);
                document.getElementById('in-phone').value = phoneMatch ? phoneMatch[0].trim() : "";

                // Auto-text lines parsing
                const lines = text.split('\n').filter(line => line.trim().length > 0);
                if (lines.length > 0) document.getElementById('in-company').value = lines[0]; 
                
                if (lines.length > 1) {
                    let rawNameLine = lines[1].trim();
                    let detectedTitle = "";
                    
                    const commonTitles = ["Dr.", "Prof.", "Ts.", "Ir.", "En.", "Cik", "Pn.", "Mr.", "Ms."];
                    
                    for (let t of commonTitles) {
                        if (rawNameLine.startsWith(t)) {
                            detectedTitle = t;
                            rawNameLine = rawNameLine.replace(t, "").trim();
                            break;
                        }
                    }

                    document.getElementById('in-title').value = detectedTitle;

                    // Filter out "Bin", "Binti", "Bte" and extract names
                    let nameParts = rawNameLine.split(' ').filter(part => {
                        let p = part.toLowerCase();
                        return p !== 'binti' && p !== 'bin' && p !== 'bte';
                    });

                    document.getElementById('in-firstname').value = nameParts[0] || ""; 
                    document.getElementById('in-lastname').value = nameParts.slice(1).join(' ') || ""; 
                }

                if (lines.length > 2) document.getElementById('in-job').value = lines[2]; 

                btnSimpan.style.display = "block";

            } catch (err) {
                statusDiv.innerHTML = "<p style='color: red;'>❌ OCR Error: " + err.message + "</p>";
            }
        }

        btnSimpan.addEventListener('click', function() {
            const finalData = {
                title: document.getElementById('in-title').value.trim(),
                first_name: document.getElementById('in-firstname').value.trim(),
                last_name: document.getElementById('in-lastname').value.trim(),
                job_title: document.getElementById('in-job').value.trim(),
                company: document.getElementById('in-company').value.trim(),
                country: document.getElementById('in-country').value.trim(),
                email: document.getElementById('in-email').value.trim().toLowerCase(),
                phone: document.getElementById('in-phone').value.trim(), 
                time_scanned: new Date().toLocaleString()
            };

            // Validation: All fields required except phone number
            if (!finalData.title || !finalData.first_name || !finalData.last_name || !finalData.job_title || !finalData.company || !finalData.country || !finalData.email) {
                alert("⚠️ Please fill in all required fields! Only the phone number is optional.");
                return;
            }

            btnSimpan.innerText = "⏳ Saving to Database...";
            database.ref('AlumniCards').push(finalData)
            .then(() => {
                alert("✅ Record successfully saved!");
                location.reload();
            })
            .catch((error) => {
                alert("❌ Failed to save: " + error);
                btnSimpan.innerText = "💾 Save to Database";
            });
        });
    </script>
</body>
</html>
